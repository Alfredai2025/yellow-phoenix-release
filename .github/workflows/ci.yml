name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build-time genesis seed; documented dev value (see build.rs). Not a secret.
  YP_GENESIS_PHRASE: YP_DEV_BUILD_2026_08_19

jobs:
  rust:
    name: Rust type-check (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --workspace --lib --bins --tests --locked

  smoke:
    name: Engine smoke test (build + insert + search + reload)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test (self-contained smoke suite)
        run: cargo test --test smoke -- --nocapture

  python:
    name: Python syntax validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compileall
        run: python -m compileall -q scripts tests

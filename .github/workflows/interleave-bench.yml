name: Interleave walk scout

# Manual-only trigger: this is a cross-silicon scout, not a per-PR gate.
# It runs the fully synthetic, public-safe interleave_walk benchmark
# (memory-system physics; NOT an ANN recall benchmark) on GitHub-hosted
# ubuntu-latest (x86-64) and macos-14 (arm64), and uploads the raw stdout
# tables as artifacts for cross-machine comparison.
on:
  workflow_dispatch:

env:
  # Build-time genesis seed; documented dev value (see build.rs). Not a secret.
  YP_GENESIS_PHRASE: YP_DEV_BUILD_2026_08_19

jobs:
  bench:
    name: interleave_walk (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build benchmark (release)
        run: cargo build --release --bin interleave_walk --locked
      - name: Run interleave walk scout (N=1M, NQ=2000, REPS=3)
        env:
          NQ: "2000"
          REPS: "3"
        run: ./target/release/interleave_walk | tee interleave_output.txt
      - name: Run frontier-batching sweep (SWEEP=1, grid {1,2}x{1,2,3,4}, REPS=5)
        env:
          SWEEP: "1"
          NQ: "2000"
          REPS: "5"
        run: ./target/release/interleave_walk | tee interleave_sweep_output.txt
      - name: THP A/B (YP_THP=1, legacy mode, ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        env:
          SWEEP: "0"
          YP_THP: "1"
          NQ: "2000"
          REPS: "5"
        run: |
          ./target/release/interleave_walk | tee thp_output.txt
          echo '--- /proc/meminfo hugepage evidence ---'
          grep -i hugepage /proc/meminfo
      - name: THP A/B not applicable here — write placeholder
        if: matrix.os != 'ubuntu-latest'
        run: |
          echo 'THP A/B step skipped: madvise(MADV_HUGEPAGE) is Linux-only (YP_THP is a no-op on this runner).' > thp_output.txt
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interleave-results-${{ matrix.os }}
          path: |
            interleave_output.txt
            interleave_sweep_output.txt
            thp_output.txt
          if-no-files-found: error
